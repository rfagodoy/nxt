# Nginx na frente do Nxt — termina o TLS e distribui entre web (3000) e API (3001).
#
# Por que existe: hoje a aplicação sobe em HTTP puro. Colocar isso numa rede
# corporativa significa senha e token trafegando em claro — é o item que reprova
# homologação de segurança antes de qualquer discussão sobre funcionalidade.
#
# Instalação:
#   Linux  : copiar para /etc/nginx/sites-available/nxt e criar o symlink em sites-enabled
#   Windows: copiar para C:\nginx\conf\nxt.conf e incluir no nginx.conf com `include nxt.conf;`
#
# ANTES de subir, ajuste: server_name, os caminhos dos certificados e, se a API não
# estiver na mesma máquina, os endereços dos upstreams.

upstream nxt_web { server 127.0.0.1:3000; keepalive 32; }
upstream nxt_api { server 127.0.0.1:3001; keepalive 32; }

# HTTP existe só para mandar todo mundo para o HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name nxt.empresa.com.br;          # <-- AJUSTAR

    # Deixe habilitado se for usar Let's Encrypt; em rede fechada, remova.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nxt.empresa.com.br;          # <-- AJUSTAR

    # Certificado do cliente. Em on-premise costuma ser emitido pela CA interna —
    # nesse caso o .crt precisa vir com a cadeia completa, ou navegador de máquina
    # não ingressada no domínio acusa certificado desconhecido.
    ssl_certificate     /etc/nginx/ssl/nxt.crt;      # <-- AJUSTAR
    ssl_certificate_key /etc/nginx/ssl/nxt.key;      # <-- AJUSTAR

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: só depois que o HTTPS estiver funcionando de verdade. Ligado cedo, com
    # certificado errado, tranca o navegador do cliente fora do sistema pelo período
    # do max-age — e não há como desfazer do lado do servidor.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Os demais cabeçalhos de segurança (CSP inclusive) são emitidos pela própria
    # aplicação (helmet). Repetir aqui produziria valor duplicado, que alguns
    # navegadores tratam como o mais restritivo dos dois — e a CSP quebraria a tela.

    client_max_body_size 25m;   # anexos de contrato; acima disso o upload falha com 413
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "";

    # A API vem primeiro: `location /api` é mais específico que `/` e precisa vencer.
    location /api/ {
        proxy_pass http://nxt_api;
        proxy_read_timeout 120s;    # exportação de planilha grande passa de 60s
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://nxt_web;
        proxy_read_timeout 60s;
    }

    # Estáticos do Next: imutáveis por construção (hash no nome), cache longo.
    location /_next/static/ {
        proxy_pass http://nxt_web;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    access_log /var/log/nginx/nxt.access.log;
    error_log  /var/log/nginx/nxt.error.log warn;
}
