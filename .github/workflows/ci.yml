name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    env:
      # Valores só de CI (build/generate/testes não conectam no banco nem assinam
      # tokens reais). NUNCA usar em produção.
      DATABASE_URL: "sqlserver://localhost:1433;database=ci;user=sa;password=Ci_Dummy_Pw_1234;encrypt=true;trustServerCertificate=true"
      AUTH_JWT_SECRET: "ci-only-secret-not-used-in-prod-0123456789abcdef0123456789"
      NODE_ENV: "test"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run db:generate --workspace @nxt/database

      - name: Verificacao de tipos (type-check)
        run: npm run type-check

      - name: Lint (ESLint — erros bloqueiam, warnings informam)
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build (api + web + packages)
        run: npm run build

      # Gate de segurança do RUNTIME (produção; devdeps ficam de fora — CVE de
      # ferramenta de build não chega ao cliente).
      #
      # Bloqueia TODO high/critical. Advisory transitivo SEM correção compatível
      # passa só se estiver nomeado em security/audit-allowlist.json, com
      # justificativa e data de revisão. Antes disto o gate estava em `critical`
      # por causa da cadeia do exceljs — e um `critical` global deixa entrar em
      # silêncio qualquer HIGH novo, que é exatamente o que ele deveria pegar.
      - name: Auditoria de dependências (runtime)
        run: npm run audit:gate

      # Visibilidade (não falha): panorama completo, inclui devDependencies.
      - name: Auditoria completa (informativa)
        run: npm audit || true
